version: "3.9"

services:
  esg-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esg-dashboard
    ports:
      - "8050:8050"
    volumes:
      - ./esg_dashboard/cache:/app/cache  # Persist Parquet cache across restarts
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - esg-network

networks:
  esg-network:
    driver: bridge
