name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          cd esg_dashboard
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd esg_dashboard
          pytest tests/ -v --tb=short

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' &&
        github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t esg-dashboard .
      - name: Smoke test
        run: |
          docker run -d -p 8050:8050 --name esg-test esg-dashboard
          sleep 15
          curl -f http://localhost:8050 || exit 1
          docker stop esg-test
